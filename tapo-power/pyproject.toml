[project]
name = "tapo-power"
version = "0.3.0"
description = "Local control and power/voltage/current monitoring for TP-Link Tapo P316M / P304M smart power strips"
requires-python = ">=3.11"
dependencies = [
    # TPAP support is unreleased (python-kasa PR #1592); pinned to a tested commit.
    "python-kasa @ git+https://github.com/ZeliardM/python-kasa@e7084472972f08f2e2235b342f3964aedbfaeb3b",
    "keyring>=25",
]

[project.scripts]
tapo-power = "tapo_power.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["tapo_power"]
