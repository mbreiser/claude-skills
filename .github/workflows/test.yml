name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # kicad-design-review tests — synthetic-fixture pytest only; no gh api or
  # network access required, so this runs cleanly in CI without auth.
  kicad-design-review:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Run pytest (kicad-design-review)
        working-directory: kicad-design-review
        run: |
          uv run --python ${{ matrix.python-version }} \
            --with pytest --with sexpdata \
            pytest tests/ -v

      - name: Smoke-test extractor --help (PEP 723 deps via uv run --script)
        working-directory: kicad-design-review
        run: |
          uv run --python ${{ matrix.python-version }} \
            --script bin/kicad-extract.py --help

  # pdf-sidecar tests — synthetic PDFs via reportlab, backends stubbed via
  # monkeypatch of the BACKENDS dispatch table, so neither Marker nor Docling
  # (and their torch dependencies) are installed in CI.
  pdf-sidecar:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Run pytest (pdf-sidecar)
        working-directory: pdf-sidecar
        run: |
          uv run --python ${{ matrix.python-version }} \
            --with pytest --with pypdf --with reportlab \
            pytest tests/ -v

      - name: Smoke-test extractor --help (PEP 723 deps via uv run --script)
        working-directory: pdf-sidecar
        run: |
          uv run --python ${{ matrix.python-version }} \
            --script bin/pdf-sidecar.py --help

  # power tests — device, MQTT, and Keychain seams are faked, so no
  # network, power device, or broker is touched in CI.
  power:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Run pytest (power)
        working-directory: power
        run: uv run --python ${{ matrix.python-version }} --project . pytest tests -v

      - name: Smoke-test CLI --help
        working-directory: power
        run: uv run --python ${{ matrix.python-version }} --project . power --help
